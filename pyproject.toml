[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "carriex-server"
dynamic = ["version"]
description = "HTTP and WebSocket relay for opaque encrypted messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "Werkzeug>=3.1.9,<4", "simple-websocket>=1.1,<2", "cryptography>=46,<51", "qrcode[pil]>=8.2,<9", "Pillow>=13,<14", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
server = ["gevent>=26.8,<27"]
dev = ["pytest>=8,<10", "websocket-client>=1.8,<2", "build>=1.2,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.data-files]
"share/carriex-server" = [".env.example", "requirements.lock"]

[tool.setuptools.dynamic]
version = {attr = "src._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
