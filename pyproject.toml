[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carriex-server"
dynamic = ["version"]
description = "HTTP and WebSocket relay for opaque encrypted messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "flask-sock>=0.7,<1", "cryptography>=46,<51", "qrcode[pil]>=8.2,<9", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
server = ["gunicorn>=23,<27; sys_platform != 'win32'"]
dev = ["pytest>=8,<10", "websocket-client>=1.8,<2", "build>=1.2,<2", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
version = {attr = "src._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
