# Standalone direct-TLS deployment; does not use the reverse-proxy compose file.
services:
  server:
    build: .
    command: ["python", "-m", "src.pairing", "--data-dir", "/var/lib/carriex", "--port", "8443"]
    environment:
      CARRIEX_HOST: "${CARRIEX_HOST:-}"
      CARRIEX_PORT: "${CARRIEX_PORT:-8443}"
      CARRIEX_PUBLIC_URL: "${CARRIEX_PUBLIC_URL:-}"
      CARRIEX_SERVER_NAME: "${CARRIEX_SERVER_NAME:-Carriex server}"
      CARRIEX_MESSAGE_TTL_SECONDS: "${CARRIEX_MESSAGE_TTL_SECONDS:-2592000}"
      CARRIEX_STATISTICS: "${CARRIEX_STATISTICS:-0}"
      CARRIEX_STATISTICS_RETENTION_DAYS: "${CARRIEX_STATISTICS_RETENTION_DAYS:-30}"
      CARRIEX_REGISTRATION_MODE: "${CARRIEX_REGISTRATION_MODE:-open}"
      CARRIEX_CONNECTION_LIMIT: "${CARRIEX_CONNECTION_LIMIT:-128}"
      CARRIEX_CONNECTIONS_PER_IP: "${CARRIEX_CONNECTIONS_PER_IP:-32}"
      CARRIEX_REQUEST_TIMEOUT: "${CARRIEX_REQUEST_TIMEOUT:-15}"
      CARRIEX_MAX_DATABASE_BYTES: "${CARRIEX_MAX_DATABASE_BYTES:-1073741824}"
      CARRIEX_WS_GLOBAL_LIMIT: "${CARRIEX_WS_GLOBAL_LIMIT:-64}"
      CARRIEX_WS_IP_LIMIT: "${CARRIEX_WS_IP_LIMIT:-20}"
      CARRIEX_WS_DEVICE_LIMIT: "${CARRIEX_WS_DEVICE_LIMIT:-2}"
      CARRIEX_ENROLL_IP_HOURLY: "${CARRIEX_ENROLL_IP_HOURLY:-30}"
      CARRIEX_ENROLL_GLOBAL_HOURLY: "${CARRIEX_ENROLL_GLOBAL_HOURLY:-120}"
      CARRIEX_SENDER_PENDING_LIMIT: "${CARRIEX_SENDER_PENDING_LIMIT:-4000}"
      CARRIEX_SENDER_STORAGE_BYTES: "${CARRIEX_SENDER_STORAGE_BYTES:-8388608}"
    ports:
      - "${PAIRED_BIND:-0.0.0.0}:${CARRIEX_PORT:-8443}:8443"
    volumes:
      - server-identity:/var/lib/carriex
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Trust the stored certificate. Hostname check is omitted ONLY for this
      # internal loopback health probe; clients always check their paired name/IP.
      test: ["CMD", "python", "-c", "import ssl,urllib.request; c=ssl.create_default_context(cafile='/var/lib/carriex/server-cert.pem'); c.check_hostname=False; urllib.request.urlopen('https://127.0.0.1:8443/health',context=c,timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  server-identity:
